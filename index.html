<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoreKey Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 font-sans">
    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-sm w-full border border-slate-100">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-slate-800">1-Click JKS Gen</h1>
            <p class="text-sm text-slate-500 mt-2">Generate your .jks instantly.</p>
        </div>
        
        <form id="keyForm" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700">GitHub PAT</label>
                <input type="password" id="pat" required placeholder="Paste ghp_ token here" class="mt-1 block w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 transition-colors">
                <p class="text-[10px] text-slate-400 mt-1 leading-tight">Required. We cannot hardcode this securely on a public webpage.</p>
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700">Keystore Password</label>
                <input type="password" id="password" required minlength="6" placeholder="Min 6 characters" class="mt-1 block w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 transition-colors">
            </div>
            
            <button type="submit" id="submitBtn" class="w-full py-3 px-4 rounded-lg shadow-sm text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 transition-all transform hover:-translate-y-0.5">
                Download .jks
            </button>
        </form>
        <div id="statusBox" class="mt-6 hidden p-4 rounded-lg bg-slate-50 border border-slate-200">
            <div id="status" class="text-sm font-medium text-slate-700 text-center"></div>
        </div>
    </div>

    <script>
        document.getElementById('keyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const statusBox = document.getElementById('statusBox');
            const status = document.getElementById('status');
            
            btn.disabled = true;
            btn.textContent = 'Generating...';
            statusBox.classList.remove('hidden');
            status.textContent = 'Triggering secure generator...';

            const pat = document.getElementById('pat').value.trim();
            const pass = document.getElementById('password').value;
            const owner = "RD7890";
            const repo = "StoreKey-Gen";
            
            const inputs = {
                alias: "upload",
                storepass: pass,
                keypass: pass,
                dname: "CN=Android Developer, O=App Dev, C=IN"
            };

            try {
                let res = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/workflows/generate.yml/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${pat}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ ref: 'main', inputs: inputs })
                });
                if (!res.ok) throw new Error('Auth failed. Check PAT.');

                status.textContent = 'Generating on GitHub servers...';
                await new Promise(r => setTimeout(r, 6000));
                
                res = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/runs?event=workflow_dispatch&per_page=1`, {
                    headers: { 'Authorization': `Bearer ${pat}` }
                });
                const runsData = await res.json();
                const runId = runsData.workflow_runs[0].id;
                
                let isCompleted = false;
                while (!isCompleted) {
                    await new Promise(r => setTimeout(r, 3000));
                    let statusRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/runs/${runId}`, {
                        headers: { 'Authorization': `Bearer ${pat}` }
                    });
                    let statusData = await statusRes.json();
                    if (statusData.status === 'completed') isCompleted = true;
                }

                status.textContent = 'Downloading zip...';
                res = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/runs/${runId}/artifacts`, {
                    headers: { 'Authorization': `Bearer ${pat}` }
                });
                const artifactData = await res.json();
                const dlUrl = artifactData.artifacts[0].archive_download_url;
                
                const downloadRes = await fetch(dlUrl, { headers: { 'Authorization': `Bearer ${pat}` } });
                const blob = await downloadRes.blob();
                const a = document.createElement('a');
                a.href = window.URL.createObjectURL(blob);
                a.download = 'android-keystore.zip';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                status.innerHTML = `<span class="text-green-600 font-bold">Downloaded!</span>`;
            } catch (err) {
                status.innerHTML = `<span class="text-red-600">Error: ${err.message}</span>`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Download .jks';
            }
        });
    </script>
</body>
</html>
